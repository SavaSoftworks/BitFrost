# Builds the BitFrost TUI exactly as releases ship it, runs its tests on each
# platform and keeps the binaries as artifacts. Pull requests and releases both
# call this, so a build that would break a release fails on the pull request.
name: tui

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Fully static with musl, so one binary runs on any Linux.
      - name: Build and test (static, in Alpine)
        if: runner.os == 'Linux'
        run: ./release/check-linux.sh tui
      # The terminal tests' sample broker runs BitFrost's TypeScript, which needs Node 23.6 or newer.
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 24
      - name: Build and test (universal)
        if: runner.os == 'macOS'
        run: |
          ./release/build-tui.sh --static dist/bitfrost-tui -- \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.3
          # Hosted macOS PTYs make the Python harness's backpressure and screen
          # timing checks unreliable. Keep them in Linux CI and local checks;
          # the universal build and native selftests still run here.
          ctest --test-dir tui/build --output-on-failure --exclude-regex '^pty-'
      - name: Check the shipped binary
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugins/bitfrost/.claude-plugin/plugin.json)
          asset="bitfrost-tui-$version-${{ matrix.platform }}"
          ./dist/bitfrost-tui --version | grep -qF "$version"
          ./dist/bitfrost-tui --selftest
          case $(uname -s) in
            Linux)
              file dist/bitfrost-tui | grep -Eq 'statically linked|static-pie linked'
              ;;
            Darwin)
              lipo -info dist/bitfrost-tui | grep -q x86_64
              lipo -info dist/bitfrost-tui | grep -q arm64
              ;;
          esac
          mv dist/bitfrost-tui "dist/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$asset" >"$asset.sha256")
          else
            (cd dist && shasum -a 256 "$asset" >"$asset.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.platform }}
          path: dist/bitfrost-tui-*

  # The C++ style check needs clang-format 23 or newer, which the build images don't have.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the C++ style
        run: |
          python3 -m pip install --user --break-system-packages clang-format
          python_user_base=$(python3 -m site --user-base)
          export PATH="$python_user_base/bin:$PATH"
          ./release/check.sh --style
