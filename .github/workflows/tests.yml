# One validation suite for every PR and for release builds.
name: tests

on:
  pull_request:
  workflow_call:

# Cancel stale PR checks, but keep every release build. Use our own group name
# because github.workflow is the caller's name inside a reusable workflow.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install migration build dependencies
        run: sudo apt-get update && sudo apt-get install -y gnucobol libsqlite3-dev
      - name: Install Claude Code (for the plugin test kit)
        run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugins/bitfrost
      - run: npm test
      - name: Check the shell scripts
        run: shellcheck release/*.sh plugins/bitfrost/bin/bitfrostd
      - name: Build the tarball
        run: |
          release/build.sh --no-tui --no-migrator
          # The installer test uses the native development build. The release
          # job replaces it with the separately tested static migration asset.
          version=$(node -p 'require("./plugins/bitfrost/.claude-plugin/plugin.json").version')
          asset="bitfrost-migrate-$version-linux-x64"
          cp plugins/bitfrost/migrations/build/bitfrost-migrate "dist/$asset"
          (cd dist && sha256sum "$asset" >"$asset.sha256")
      - name: Install from the tarball into a throwaway home
        run: |
          install_home=$(mktemp -d)
          version=$(node -p 'require("./plugins/bitfrost/.claude-plugin/plugin.json").version')
          grep -qx "RELEASE=$version" dist/install.sh
          HOME=$install_home sh dist/install.sh --from "dist/bitfrost-$version.tar.gz"
          test -x "$install_home/.local/bin/bitfrost"
          HOME=$install_home "$install_home/.local/bin/bitfrost" socket
          HOME=$install_home claude plugin list | grep -q 'bitfrost@bitfrost'
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/

  # The TUI builds same way as releases ship it, on every platform, with its tests.
  tui:
    uses: ./.github/workflows/tui.yml

  migrations:
    uses: ./.github/workflows/migrations.yml

  # install.sh must also work with macOS's BSD tools.
  install-macos:
    needs: [unit, migrations]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: migrate-darwin-universal
          path: dist/
      - name: Install into a throwaway home, then again (swaps the link)
        run: |
          install_home=$(mktemp -d)
          version=$(node -p 'require("./plugins/bitfrost/.claude-plugin/plugin.json").version')
          HOME=$install_home sh dist/install.sh --from "dist/bitfrost-$version.tar.gz"
          HOME=$install_home sh dist/install.sh --from "dist/bitfrost-$version.tar.gz"
          test -L "$install_home/.local/share/bitfrost/current"
          HOME=$install_home "$install_home/.local/bin/bitfrost" socket
          HOME=$install_home claude plugin list | grep -q 'bitfrost@bitfrost'
