# Reuses PR validation on main pushes. Releases when plugin.json has a new version.
name: release

on:
  push:
    branches: [main]
  # Run it by hand on any branch to try the release builds; only a push to main releases.
  workflow_dispatch:

# Main pushes never cancel older runs, so no release gets dropped.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Is this version released yet?
        id: check
        run: |
          version=$(node -p 'require("./plugins/bitfrost/.claude-plugin/plugin.json").version')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in plugin.json to make a new one"
            echo "new=false" >>"$GITHUB_OUTPUT"
          else
            echo "new=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.new == 'true'
        with:
          name: tarball
          path: dist/
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.new == 'true'
        with:
          pattern: tui-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.new == 'true'
        with:
          pattern: migrate-*
          merge-multiple: true
          path: dist/
      - name: Make the release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "bitfrost $VERSION" \
            --generate-notes \
            "dist/bitfrost-$VERSION.tar.gz" \
            "dist/bitfrost-$VERSION.tar.gz.sha256" \
            dist/install.sh \
            "dist/bitfrost-migrate-$VERSION-linux-x64" \
            "dist/bitfrost-migrate-$VERSION-linux-x64.sha256" \
            "dist/bitfrost-migrate-$VERSION-linux-arm64" \
            "dist/bitfrost-migrate-$VERSION-linux-arm64.sha256" \
            "dist/bitfrost-migrate-$VERSION-darwin-universal" \
            "dist/bitfrost-migrate-$VERSION-darwin-universal.sha256" \
            "dist/bitfrost-tui-$VERSION-linux-x64" \
            "dist/bitfrost-tui-$VERSION-linux-x64.sha256" \
            "dist/bitfrost-tui-$VERSION-linux-arm64" \
            "dist/bitfrost-tui-$VERSION-linux-arm64.sha256" \
            "dist/bitfrost-tui-$VERSION-darwin-universal" \
            "dist/bitfrost-tui-$VERSION-darwin-universal.sha256"
